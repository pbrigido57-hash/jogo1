<script>
// Conexão online: imita a "sala" do Claude usando WebSocket no servidor próprio.
const sala=(new URLSearchParams(location.search).get('sala')||'ilha').toLowerCase();
document.getElementById('sl').textContent=sala;
window.claude={use:async n=>n!=='room'?null:new Promise(res=>{
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/?sala='+encodeURIComponent(sala));
  let id=null,peers=[],L={},done=false;
  const send=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o))};
  const room={presence:p=>{send({t:'p',d:p});return Promise.resolve()},emit:(t,d)=>{send({t:'e',topic:t,data:d});return Promise.resolve()},
    on:(t,f)=>{(L[t]=L[t]||[]).push(f);return()=>{}},peers:()=>peers,connected:()=>ws.readyState===1};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.t==='hi'){id=m.id;done=true;res(room)}
    else if(m.t==='peers')peers=m.list.map(p=>({peer:p.peer,kind:'viewer',isMe:p.peer===id,sameTab:p.peer===id,presence:p.presence}));
    else if(m.t==='e')(L[m.topic]||[]).forEach(f=>f({topic:m.topic,peer:m.peer,isMe:m.peer===id,sameTab:m.peer===id,data:m.data}))};
  ws.onclose=()=>{if(!done)res(null);else if(typeof toast==='function')toast('Conexão perdida — recarregue a página')};
  ws.onerror=()=>{if(!done)res(null)};
  setTimeout(()=>{if(!done)res(null)},5000);
})};
</script>

a.bar.position.set(p.x,2.3*d.z+.3,p.z);a.bar.quaternion.copy(cam.quaternion);const q=Math.max(0,a.hp/a.max);a.fg.scale.x=q||.001;a.fg.position.x=-(1-q)*.6}
function onSnap(m){if(net.host||m.peer!==net.hp)return;const L=m.data&&m.data.a;if(!Array.isArray(L))return;const seen={};
L.forEach(e=>{const[id,k,x,z,r,hp]=e;if(!A[k])return;seen[id]=1;let a=animals.find(o=>o.id==id);if(!a){a=mkAnimal(k);a.id=id;a.by={};a.g.position.set(x,0,z);scene.add(a.g);animals.push(a)}a.tx=x;a.tz=z;a.tr=r;if(hp<a.hp){a.fl=.15;flash(a,0xff0000)}a.hp=hp});
animals.slice().forEach(a=>{if(!seen[a.id])gone(a)})}
function mkAv(col){const g=new T.Group();g.add(at(box(.8,1,.5,col),0,1.1,0),at(box(.5,.5,.5,0xf0c090),0,1.85,0),at(box(.3,.6,.3,0x333355),-.2,.3,0),at(box(.3,.6,.3,0x333355),.2,.3,0));
const arm=new T.Group();arm.position.set(.55,1.5,0);arm.add(at(box(.25,.8,.25,0xf0c090),0,-.4,0));const h=new T.Group();h.position.y=-.8;h.rotation.x=Math.PI/2;arm.add(h);g.add(arm);g.arm=arm;g.h=h;g.w=-1;g.sw=-1;scene.add(g);return g}
function netTick(dt){const r=net.room;$('pl').textContent=r?r.peers().filter(p=>p.kind=='viewer').length:1;if(!r)return;
const ps=r.peers(),mp=ps.find(p=>p.isMe&&p.sameTab);if(mp)net.id=mp.peer;
const el=ps.filter(p=>p.kind=='viewer'&&p.presence.on).sort((a,b)=>((a.presence.t||0)-(b.presence.t||0))||(a.peer<b.peer?-1:1));
net.hp=el[0]?el[0].peer:net.id;net.host=net.hp===net.id;
net.pt-=dt;if(net.pt<=0){net.pt=.07;r.presence({x:+me.x.toFixed(2),z:+me.z.toFixed(2),r:+yaw.toFixed(2),w:S.w,at:net.ac,on:started&&!dead?1:0,dd:dead?1:0})}
if(net.host&&started){net.st-=dt;if(net.st<=0){net.st=.085;r.emit('an',{a:animals.map(a=>[a.id,a.k,+a.g.position.x.toFixed(2),+a.g.position.z.toFixed(2),+a.g.rotation.y.toFixed(2),Math.round(a.hp)])})}}
const seen={};ps.forEach(p=>{const s=p.presence;if(p.isMe||p.kind!='viewer'||typeof s.x!='number')return;seen[p.peer]=1;let g=AV[p.peer];
if(!g){let h=0;for(const c of p.peer)h=(h*31+c.charCodeAt(0))%360;g=AV[p.peer]=mkAv(new T.Color('hsl('+h+',70%,50%)').getHex());g.position.set(s.x,0,s.z);g.at=s.at}
g.position.x+=(s.x-g.position.x)*Math.min(1,dt*12);g.position.z+=(s.z-g.position.z)*Math.min(1,dt*12);g.rotation.y=(+s.r||0)+Math.PI;
if(g.w!==s.w){g.w=s.w;g.h.clear();g.h.add(mkW(s.w|0))}
if(s.at!==g.at){g.at=s.at;g.sw=0}if(g.sw>=0){g.sw+=dt;g.arm.rotation.x=-Math.sin(Math.min(g.sw/.3,1)*Math.PI)*2;if(g.sw>.3){g.sw=-1;g.arm.rotation.x=0}}
g.visible=!s.dd});
for(const id in AV)if(!seen[id]){scene.remove(AV[id]);delete AV[id]}}
(async()=>{try{if(!window.claude||!claude.use)return;const r=await claude.use('room');if(!r)return;net.room=r;r.presence({t:Date.now()});
r.on('an',onSnap);
r.on('spawn',m=>{const k=m.data&&m.data.k;if(net.host&&A[k]&&!(k=='rei'&&animals.some(a=>a.k=='rei')))spawn(k)});
r.on('hit',m=>{if(!net.host)return;const d=m.data||{},a=animals.find(o=>o.id==d.id);if(a&&d.d>0&&d.d<=120)dmg(a,+d.d,+d.x||0,+d.z||0,m.peer)});
r.on('dmg',m=>{const d=m.data||{};if(d.to===net.id&&started&&!dead)hurt(Math.min(100,+d.d||0))});
r.on('kill',m=>{const d=m.data||{};if(d.to===net.id&&A[d.k])loot(d.k)})}catch(e){}})();
function spawn(k){if(animals.length>=(net.room?8:5))return false;let x,z;do{const a=rnd()*6.28;x=Math.cos(a)*16;z=Math.sin(a)*16}while(Math.hypot(x-HUT.x,z-HUT.z)<9||Math.hypot(x-me.x,z-me.z)<7);
const a=mkAnimal(k);a.id=Math.random().toString(36).slice(2,7);a.by={};a.g.position.set(x,0,z);scene.add(a.g);animals.push(a);return true}
function flash(a,v){a.g.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(v)})}
function gone(a){scene.remove(a.g,a.bar);const i=animals.indexOf(a);if(i>=0)animals.splice(i,1)}
function loot(k){S.meat[k]++;toast('+1 '+A[k].n+(k=='rei'?' — BOSS derrotado!':''));hud()}
function kill(a){gone(a);if(!net.room||!net.id)return loot(a.k);const ps=Object.keys(a.by||{});if(!ps.length)ps.push(net.id);ps.forEach(p=>p==net.id?loot(a.k):net.room.emit('kill',{to:p,k:a.k}))}
function dmg(a,d,x,z,p){a.hp-=d;const kb=1.2/A[a.k].z;a.g.position.x+=x*kb;a.g.position.z+=z*kb;a.fl=.15;flash(a,0xff0000);if(p&&a.by)a.by[p]=1;if(a.hp<=0)kill(a)}

// UI
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2000)}
$('baits').innerHTML=B.map((b,i)=>`<div>${i+1}<br>${b.e}<br><span id="b${i}"></span></div>`).join('');
const total=()=>Object.values(S.meat).reduce((a,b)=>a+b,0),value=()=>Object.keys(S.meat).reduce((a,k)=>a+S.meat[k]*A[k].v,0);
function hud(){$('hpn').textContent=Math.ceil(S.hp);$('hp').style.width=S.hp+'%';$('mo').textContent=S.money;$('wn').textContent=W[S.w].n+' (dano '+W[S.w].d+')';$('an').textContent=total()+' (vale $'+value()+')';B.forEach((b,i)=>$('b'+i).textContent='x'+S.bait[i])}
function act(it){const o=it.o;
if(o.t=='w'){const w=W[o.i];if(S.own[o.i])equip(o.i);else if(S.money>=w.p){S.money-=w.p;S.own[o.i]=1;equip(o.i);toast('Comprou '+w.n+'!')}else toast('Dinheiro insuficiente')}
if(o.t=='b'){const b=B[o.i];if(S.money>=b.p){S.money-=b.p;S.bait[o.i]++;toast('Comprou '+b.n)}else toast('Dinheiro insuficiente')}
if(o.t=='s'){const v=value();if(!v)toast('Você não tem animais para vender');else{S.money+=v;for(const k in S.meat)S.meat[k]=0;toast('Vendeu por $'+v)}}hud()}
const fw=new T.Vector3(),tv=new T.Vector3();
function look(){let best=null,bd=.95;cam.getWorldDirection(fw);for(const it of IT){tv.copy(it.p).sub(cam.position);const d=tv.length();if(d<4.5){const c=tv.dot(fw)/d;if(c>bd){bd=c;best=it}}}return best}
function tipText(it){if(!it)return'';const o=it.o;
if(o.t=='w'){const w=W[o.i];return S.own[o.i]?`${w.n} — ${S.w==o.i?'equipada':'E: equipar'}`:`${w.n} · dano ${w.d} · $${w.p}\nE: comprar`}
if(o.t=='b'){const b=B[o.i];return `${b.e} ${b.n} · $${b.p}\nAtrai: ${b.a.map(k=>A[k].n).join(', ')}\nE: comprar`}
return `Balcão: vender ${total()} animais por $${value()}\nE: vender`}

function useBait(i){if(!started||dead||!S.bait[i])return;if(animals.length>=(net.room?8:5))return toast('Muitos animais por perto!');
const b=B[i],k=b.a[Math.floor(rnd()*b.a.length)];if(i==3&&animals.some(a=>a.k=='rei'))return toast('O Boss já está na ilha!');
S.bait[i]--;if(net.room)net.room.emit('spawn',{k});else spawn(k);toast(b.e+' '+A[k].n+' ('+A[k].lv+') apareceu!');hud()}
function attack(){if(!started||dead||cd>0)return;atk=0;cd=W[S.w].c;hit=false;net.ac++}
function strike(){const w=W[S.w],fx=-Math.sin(yaw),fz=-Math.cos(yaw);
animals.slice().forEach(a=>{const dx=a.g.position.x-me.x,dz=a.g.position.z-me.z,d=Math.hypot(dx,dz);
if(d<w.r+.6*A[a.k].z&&(dx*fx+dz*fz)/(d||1)>.5){const dm=w.d*(.9+rnd()*.2);if(net.host)dmg(a,dm,dx/d,dz/d,net.id);else{net.room.emit('hit',{id:a.id,d:+dm.toFixed(1),x:+(dx/d).toFixed(2),z:+(dz/d).toFixed(2)});a.fl=.15;flash(a,0xff0000)}}})}
function hurt(d){S.hp-=d;shake=.25;$('hit').style.opacity=.45;setTimeout(()=>$('hit').style.opacity=0,120);if(S.hp<=0)die();hud()}
function die(){dead=true;toast('Você desmaiou... perdeu metade do dinheiro');S.money=Math.floor(S.money/2);setTimeout(()=>{if(!net.room){animals.forEach(a=>scene.remove(a.g,a.bar));animals=[]}for(const k in S.meat)S.meat[k]=0;S.hp=100;me.set(0,0,4);dead=false;hud()},2200)}

// entrada
const K={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(!started)return;if(k==' '){e.preventDefault();attack()}
if(k>='1'&&k<='4')useBait(+k-1);if(k=='e'){const it=look();if(it)act(it)}});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
R.domElement.addEventListener('mousedown',attack);
addEventListener('mousemove',e=>{if(started&&document.pointerLockElement){yaw-=e.movementX*.0022;pitch=Math.max(-1.3,Math.min(1.3,pitch-e.movementY*.0022))}});
$('ov').onclick=()=>{started=true;$('ov').style.display='none';try{R.domElement.requestPointerLock()}catch(x){}};
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&started){started=false;$('ov').style.display='flex';$('ov').children[1].textContent='Jogo pausado — clique para continuar'}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});

// loop
const clk=new T.Clock(),wp=wg.attributes.position;equip(0);
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);tt+=dt;
for(let i=0;i<wp.count;i++){const x=wp.getX(i),z=wp.getZ(i);wp.setY(i,Math.sin(x*.25+tt*1.2)*.12+Math.cos(z*.2+tt*1.5)*.12)}wp.needsUpdate=true;
foam.material.opacity=.35+Math.sin(tt*1.5)*.15;clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>170)c.position.x=-170});
IT.forEach(it=>{if(it.spin)it.m.rotation.y+=dt});
let mv=0;
if(started&&!dead){cd-=dt;
yaw-=((K.arrowleft?-1:0)+(K.arrowright?1:0))*2*dt;pitch=Math.max(-1.3,Math.min(1.3,pitch+((K.arrowup?1:0)-(K.arrowdown?1:0))*1.5*dt));
const mf=(K.w?1:0)-(K.s?1:0),mr=(K.d?1:0)-(K.a?1:0);mv=mf||mr;const l=Math.hypot(mf,mr)||1,sp=(K.shift?9:6)*dt;
me.x+=(-Math.sin(yaw)*mf+Math.cos(yaw)*mr)/l*sp;me.z+=(-Math.cos(yaw)*mf-Math.sin(yaw)*mr)/l*sp;
const r=Math.hypot(me.x,me.z);if(r>19.5){me.x*=19.5/r;me.z*=19.5/r}push(me,.45);
if(atk>=0){atk+=dt;const t=Math.min(atk/.3,1);vm.rotation.x=-Math.sin(t*Math.PI)*1.1;vm.position.z=-.55-Math.sin(t*Math.PI)*.25;if(!hit&&atk/.3>.4){hit=true;strike()}if(atk>=.3){atk=-1;vm.rotation.x=0;vm.position.z=-.55}}
const hh=inHut(me);S.hp=Math.min(100,S.hp+(hh?5:.4)*dt);$('hp').style.width=S.hp+'%';$('hpn').textContent=Math.ceil(S.hp);
animals.forEach(a=>{const d=A[a.k];if(!net.host){mirror(a,dt);return}const tg=pick(a),dx=tg.x-a.g.position.x,dz=tg.z-a.g.position.z,dist=Math.hypot(dx,dz),reach=1.2*d.z+.8;
a.g.rotation.y=Math.atan2(dx,dz);a.cd-=dt;
if(dist>reach){a.g.position.x+=dx/dist*d.s*dt;a.g.position.z+=dz/dist*d.s*dt;const q=a.g.position;push(q,.5*d.z);a.g.position.y=a.fly?.1+Math.sin(tt*6)*.15:Math.abs(Math.sin(tt*10))*.1}
else if(a.cd<=0&&!tg.none){a.cd=1.3;if(tg.p)net.room.emit('dmg',{to:tg.p,d:d.d});else hurt(d.d)}
if(a.fly){a.g.w1.rotation.z=Math.sin(tt*14)*.5;a.g.w2.rotation.z=-Math.sin(tt*14)*.5}
if(a.fl>0){a.fl-=dt;if(a.fl<=0)flash(a,0)}
a.bar.position.set(a.g.position.x,2.3*d.z+.3,a.g.position.z);a.bar.quaternion.copy(cam.quaternion);const q=Math.max(0,a.hp/a.max);a.fg.scale.x=q||.001;a.fg.position.x=-(1-q)*.6});
if(!S.bait[0]&&S.money<8&&!total()&&!animals.length){stuck+=dt;if(stuck>12){S.bait[0]++;stuck=0;toast('Você achou uma fruta na praia 🍎');hud()}}else stuck=0;
const it=look();$('tip').textContent=tipText(it)}
netTick(dt);shake=Math.max(0,shake-dt);
cam.position.set(me.x+(rnd()-.5)*shake*.3,1.7+(mv?Math.sin(tt*10)*.05:0),me.z);cam.rotation.set(pitch,yaw,0,'YXZ');
vm.position.y=-.36+Math.sin(tt*1.5)*.005+(mv?Math.sin(tt*10)*.01:0);
R.render(scene,cam)})();
</script></body></html>
